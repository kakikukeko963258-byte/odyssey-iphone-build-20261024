name: iPhone build checks
on:
  workflow_dispatch:
    inputs:
      preflight_only:
        description: Run game-free checks before transferring large inputs
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Verify Apple Silicon and Xcode
        run: |
          uname -m
          test "$(uname -m)" = arm64
          xcodebuild -version
          df -h "$RUNNER_TEMP"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch pinned upstream source
        run: |
          git clone https://github.com/NicholasDominici/super-mario-odyssey-ios.git "$RUNNER_TEMP/source"
          git -C "$RUNNER_TEMP/source" checkout 5abe9c27ec5467d486a9708f2317b503f15b6e2a
      - name: Install dependencies
        run: |
          brew install xcodegen spirv-cross zstd sevenzip
          python -m pip install -r "$RUNNER_TEMP/source/requirements.txt"
          dotnet --list-sdks
          DOTNET_ROOT="$(python -c 'import os, shutil; print(os.path.dirname(os.path.realpath(shutil.which("dotnet"))))')"
          test -d "$DOTNET_ROOT/shared/Microsoft.NETCore.App"
          echo "DOTNET_ROOT=$DOTNET_ROOT" >> "$GITHUB_ENV"
          echo "DOTNET_ROOT_ARM64=$DOTNET_ROOT" >> "$GITHUB_ENV"
      - name: Run game-free source checks
        run: python "$RUNNER_TEMP/source/tools/check.py"
      - name: Verify native extraction tool can start
        run: |
          dotnet build "$RUNNER_TEMP/source/dm/tools/nx_extract" -c Release -o "$RUNNER_TEMP/extract-preflight" -v quiet -nologo
          set +e
          "$RUNNER_TEMP/extract-preflight/nx_extract"
          result=$?
          set -e
          test "$result" = 2
      - name: Download private game inputs
        if: ${{ !inputs.preflight_only }}
        env:
          TRANSFER_URL: ${{ secrets.TRANSFER_URL }}
          TRANSFER_TOKEN: ${{ secrets.TRANSFER_TOKEN }}
          PROD_KEYS: ${{ secrets.PROD_KEYS }}
        run: |
          mkdir -p "$RUNNER_TEMP/game-inputs" "$RUNNER_TEMP/private-inputs" "$RUNNER_TEMP/artifacts"
          curl --fail --silent --show-error --location --retry 3 -H "X-Transfer-Token: $TRANSFER_TOKEN" "$TRANSFER_URL/base.7z" -o "$RUNNER_TEMP/private-inputs/base.7z"
          curl --fail --silent --show-error --location --retry 3 -H "X-Transfer-Token: $TRANSFER_TOKEN" "$TRANSFER_URL/update.nsp" -o "$RUNNER_TEMP/game-inputs/update.nsp"
          7zz x "$RUNNER_TEMP/private-inputs/base.7z" "-o$RUNNER_TEMP/game-inputs" '*.nsp' '*.xci'
          printf '%s\n' "$PROD_KEYS" > "$RUNNER_TEMP/private-inputs/prod.keys"
          chmod 600 "$RUNNER_TEMP/private-inputs/prod.keys"
      - name: Build unsigned iPhone IPA
        if: ${{ !inputs.preflight_only }}
        run: |
          python "$RUNNER_TEMP/source/tools/odyssey.py" \
            --nsp-dir "$RUNNER_TEMP/game-inputs" \
            --keys "$RUNNER_TEMP/private-inputs/prod.keys" \
            --preset iphone \
            --bundle-id org.nxnative.odyssey \
            --work "$RUNNER_TEMP/odyssey-build" \
            --output "$RUNNER_TEMP/artifacts/SuperMarioOdyssey-iphone-unsigned.ipa"
      - name: Return private IPA to workstation
        if: ${{ !inputs.preflight_only }}
        env:
          TRANSFER_URL: ${{ secrets.TRANSFER_URL }}
          TRANSFER_TOKEN: ${{ secrets.TRANSFER_TOKEN }}
        run: python upload_ipa.py
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.preflight_only && github.event.repository.private }}
        with:
          name: SuperMarioOdyssey-iphone-unsigned
          path: ${{ runner.temp }}/artifacts/*.ipa
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
